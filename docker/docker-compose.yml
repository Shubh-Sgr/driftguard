# Two identical PostgreSQL 16 databases. Eval scenarios later mutate `target-db`
# to create known drift; `source-db` stays as the reference.
name: driftguard

x-postgres: &postgres
  image: postgres:16-alpine
  # Sized for an 8 GB laptop: small caches, few connections, a hard memory cap.
  command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=128MB"]
  mem_limit: 768m
  environment:
    # Local-only superuser, used by the seed scripts and eval setup — never by DriftGuard itself.
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: fintech
    # Rows in `transactions` (ledger_entries gets 2x). 1M locally; CI sets 20000.
    SEED_TRANSACTIONS: ${SEED_TRANSACTIONS:-1000000}
  volumes:
    # Every *.sql / *.sh file here runs once, in filename order, on first start.
    - ./seed:/docker-entrypoint-initdb.d:ro
  healthcheck:
    # -h 127.0.0.1 matters: during init the entrypoint runs a temporary server that only
    # listens on the Unix socket. Checking TCP means "healthy" = seed finished + real server up.
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "fintech"]
    interval: 3s
    timeout: 3s
    retries: 5
    # Seeding 3M rows can take several minutes (longer on shared CI runners). Failed
    # checks during start_period don't count, so a slow seed isn't marked "unhealthy".
    start_period: 15m

services:
  source-db:
    <<: *postgres
    # 127.0.0.1 only: the demo superuser password is "postgres", so never expose it to the network.
    ports: ["127.0.0.1:5433:5432"]

  target-db:
    <<: *postgres
    ports: ["127.0.0.1:5434:5432"]
