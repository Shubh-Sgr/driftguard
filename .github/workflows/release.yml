name: Release

# Publishes to npm when a GitHub release is published (tag vX.Y.Z = package.json version).
# Uses npm trusted publishing: no npm token is stored in this repo. npm checks this workflow's
# OIDC identity and attaches a provenance statement that links the published version to this
# repository, commit and workflow run (shown on npmjs.com as "Built and signed on GitHub Actions").
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing and provenance)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      # Publishing the wrong commit is the mistake to prevent: the release tag must be the
      # version in package.json (v0.4.1 -> 0.4.1).
      - name: Check the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the typecheck, the unit tests and a clean build first.
      # A GitHub pre-release goes to the "next" dist-tag, so `npm install pgvouch` doesn't get it.
      - run: npm publish --provenance --access public ${{ github.event.release.prerelease && '--tag next' || '' }}
