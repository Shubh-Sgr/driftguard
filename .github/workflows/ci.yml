name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests + evals (Postgres 16 in Docker)
    runs-on: ubuntu-latest
    needs: unit
    env:
      # A small seed keeps CI fast (~seconds instead of minutes). Tests scale their
      # expectations from this. The 1M-row numbers in the README come from local runs.
      SEED_TRANSACTIONS: "20000"
      # Shadow-run tests start containers that reach the databases through the Docker
      # bridge (Linux has no loopback shortcut). Fine on a throwaway runner; never locally.
      DB_BIND: "0.0.0.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run test:integration
      # Lock accuracy against real pg_locks. (The scenario suite and the load benchmark use
      # row ids and timings from the 1M-row seed, so they run locally: npm run eval.)
      - run: npm run eval -- --only locks --out results-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results-ci.*
      - if: always()
        run: npm run db:down

  image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: [unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Image names must be lowercase; the GitHub owner name may not be.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # Third-party actions that see the registry token are pinned to a commit SHA, so a
      # moved tag can't change what runs. Dependabot updates the SHA and the comment.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pgvouch:latest
            ghcr.io/${{ env.OWNER }}/pgvouch:${{ github.sha }}
