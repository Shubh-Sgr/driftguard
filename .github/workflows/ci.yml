name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests + evals (Postgres 16 in Docker)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Seeds 1M transactions + 2M ledger entries into both databases (takes a few minutes).
      - run: npm run db:up
      - run: npm run test:integration
      # Deterministic parts of the eval (no LLM, no timing-sensitive benchmark).
      - run: npm run eval -- --only scenarios locks --out results-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results-ci.*
      - if: always()
        run: npm run db:down

  image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: [unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the GitHub owner name may not be.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/driftguard:latest
            ghcr.io/${{ env.OWNER }}/driftguard:${{ github.sha }}
